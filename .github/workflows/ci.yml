name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
        env:
          RAILWAY_ENVIRONMENT: production
      - name: Build Railway Docker image
        run: docker build -t zapflow-railway-test .

      - name: Install browser regression runner
        run: |
          mkdir -p /tmp/zapflow-smoke
          cd /tmp/zapflow-smoke
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/scripts/production-smoke.mjs" ./production-smoke.mjs

      - name: Exercise production build before deployment
        env:
          BASE_URL: http://127.0.0.1:3000
          PORT: 3000
          HOST: 0.0.0.0
        run: |
          node .output/server/index.mjs > /tmp/zapflow-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node /tmp/zapflow-smoke/production-smoke.mjs
